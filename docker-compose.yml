services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "60"
      CORS_ORIGINS: http://localhost
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Relative path — the browser sends /api/* to nginx, which proxies to backend internally.
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
